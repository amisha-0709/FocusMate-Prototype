<title>FocusMate Prototype App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&family=Inter:wght@500;600;700;800&display=swap">
<style>
:root{
  --numf:-apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,'Inter',system-ui,sans-serif;
  color-scheme:dark;
  --bg:#101017;--card:#1A1A23;--fg:#F5F2EC;--soft:#C9C6BE;--muted:#A09FA8;--faint:#8C8B96;
  --i:255,255,255;--c:30,30,40;--b:16,16,23;--sh:1;
  --amber:#FFB547;--mint:#6FD6A8;--peri:#C9D0FF;--coral:#FF9B8E;--pink:#FFB3D2;--backdrop:#06050C;
  --surface:rgba(34,33,45,.62);--surface-edge:rgba(255,255,255,.09);--surface-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 12px 32px rgba(3,2,12,.45);
  --glass-bg:rgba(30,30,40,.78);--glass-edge:rgba(255,255,255,.12);--glass-hi:rgba(255,255,255,.16);--glass-sheen:.07;--glass-active:rgba(255,181,71,.16);
}

:root[data-fm-theme="light"]{
  color-scheme:light;--bg:#F3F2EE;--card:#FFFFFF;--fg:#111114;--soft:#3A3A40;--muted:#5E5D66;--faint:#6B6A73;
  --i:20,20,32;--c:255,255,255;--b:243,242,238;--sh:.28;
  --amber:#9A4F00;--mint:#1C7A52;--peri:#3F4BC0;--coral:#B83A28;--pink:#B0336B;--backdrop:#E4E2DC;
  --surface:#FFFFFF;--surface-edge:rgba(20,20,32,.07);--surface-shadow:0 1px 2px rgba(20,20,32,.04),0 6px 20px rgba(20,20,32,.05);
  --glass-bg:rgba(255,255,255,.88);--glass-edge:rgba(255,255,255,.7);--glass-hi:rgba(255,255,255,.95);--glass-sheen:.45;--glass-active:rgba(154,79,0,.10);
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{box-sizing:border-box;background:var(--backdrop);color:var(--fg);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.frame{position:relative;width:100%;max-width:390px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden;overflow:clip;transition:background-color .45s,color .45s}
@media (min-width:601px){body{display:flex;align-items:center;justify-content:center;padding:20px 16px}.frame{height:min(844px,100%);border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,calc(.45*var(--sh) + .1)),0 0 0 1px rgba(var(--i),.08)}}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 18px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.scr.nav-pad{padding-bottom:calc(128px + env(safe-area-inset-bottom, 0px))}
.scr::-webkit-scrollbar{display:none}
.glow-amber{background:radial-gradient(110% 30% at 90% -5%,rgba(255,164,64,.14),rgba(255,164,64,0) 65%),var(--bg)}
.glow-peri{background:radial-gradient(100% 30% at 15% 0%,rgba(140,155,255,.13),rgba(140,155,255,0) 70%),var(--bg)}
.glow-mint{background:radial-gradient(100% 35% at 50% 0%,rgba(111,214,168,.12),rgba(111,214,168,0) 70%),var(--bg)}
:root:not([data-fm-theme="light"]) :is(.glow-amber,.glow-peri,.glow-mint){background:transparent}
#app{position:relative;z-index:1;height:100%}
:root:not([data-fm-theme="light"]) .frame{background:radial-gradient(120% 60% at 50% 115%,#1A1826 0%,rgba(26,24,38,0) 60%),linear-gradient(180deg,#111118 0%,#0F0F15 100%)}
:root:not([data-fm-theme="light"]) .frame::before,:root:not([data-fm-theme="light"]) .frame::after{content:'';position:absolute;z-index:0;pointer-events:none;border-radius:50%}
:root:not([data-fm-theme="light"]) .frame::before{width:420px;height:420px;top:-170px;right:-170px;background:radial-gradient(circle,rgba(255,200,165,.13) 0%,rgba(255,190,170,.05) 42%,rgba(255,190,170,0) 70%);animation:auroraA 18s ease-in-out infinite alternate}
:root:not([data-fm-theme="light"]) .frame::after{width:460px;height:460px;top:38%;left:-230px;background:radial-gradient(circle,rgba(190,180,255,.11) 0%,rgba(175,195,255,.04) 42%,rgba(175,195,255,0) 70%);animation:auroraB 22s ease-in-out infinite alternate}
@keyframes auroraA{to{transform:translate(-60px,90px) scale(1.15)}}
@keyframes auroraB{to{transform:translate(90px,-80px) scale(1.2)}}
:root:not([data-fm-theme="light"]) :is(.card,.ghost,.tool,.opt,.chip,.goal,.pf-theme,.rw-card,.subj-card,.chat-card){-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
:root:not([data-fm-theme="light"]) :is(.card,.ghost,.tool,.opt,.chip,.goal,.pf-chip,.pf-theme,.rw-card,.subj-card){background-image:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.01) 55%)}
:root:not([data-fm-theme="light"]) h1{background:linear-gradient(95deg,#FFFFFF 0%,#FBEFE6 60%,#F3E1D6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
:root:not([data-fm-theme="light"]) .section-label{color:#A7A5B6}
:root:not([data-fm-theme="light"]) .scr>.row:first-child{background:rgba(16,16,23,.8)}
@media (prefers-reduced-motion: reduce){.frame::before,.frame::after{animation:none!important}}
:root:not([data-fm-theme="light"]) .hcard.amber,:root:not([data-fm-theme="light"]) .rw-hero,:root:not([data-fm-theme="light"]) .pf-hero{box-shadow:0 16px 40px rgba(244,126,60,.14),inset 0 1px 0 rgba(255,255,255,.3)}
:root:not([data-fm-theme="light"]) .hcard.peri{box-shadow:0 16px 40px rgba(100,112,240,.15),inset 0 1px 0 rgba(255,255,255,.3)}
:root:not([data-fm-theme="light"]) .park-card,:root:not([data-fm-theme="light"]) .prog-hero{box-shadow:0 16px 40px rgba(34,165,133,.13),inset 0 1px 0 rgba(255,255,255,.25)}
:root:not([data-fm-theme="light"]) .dock{box-shadow:0 14px 36px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
:root:not([data-fm-theme="light"]) .frame{box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.scr>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.scr>*:nth-child(2){animation-delay:.05s}.scr>*:nth-child(3){animation-delay:.1s}.scr>*:nth-child(4){animation-delay:.15s}.scr>*:nth-child(5){animation-delay:.2s}.scr>*:nth-child(6){animation-delay:.25s}.scr>*:nth-child(7){animation-delay:.3s}.scr>*:nth-child(n+8){animation-delay:.35s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes navup{from{opacity:0;transform:translateY(34px)}}
@keyframes pop{0%{transform:scale(.96)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes ctaglow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.07)}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.05)}}
@keyframes breathe{0%{transform:scale(.6)}33%{transform:scale(1)}50%{transform:scale(1)}100%{transform:scale(.6)}}
@keyframes orb{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sheetup{from{transform:translateY(100%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fillx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dasharray:0 2000}}
@keyframes flicker{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes adfloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(8deg)}}
@keyframes adsheen{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(320%) skewX(-20deg)}}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(300px) rotate(340deg);opacity:0}}
.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1)}.shake{animation:shake .45s ease}
button,a{transition:transform .18s cubic-bezier(.2,.8,.2,1),filter .18s}
button:hover:not(:disabled){filter:brightness(1.06)}button:active:not(:disabled){transform:scale(.96)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}

.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex-grow:1}
.icon-btn{width:44px;height:44px;flex-shrink:0;border-radius:14px;border:1px solid rgba(var(--i),.07);background:rgba(var(--i),.05);display:flex;align-items:center;justify-content:center;padding:0}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.brand{flex-grow:1;display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px}
.logo{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE3AE,#FFB547 60%,#D9801A);box-shadow:0 0 16px rgba(255,181,71,.6)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;line-height:1.04;letter-spacing:-.8px;text-wrap:balance}
h1 em,.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--amber)}
h1 em{font-size:1.13em}
h2{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.3px}
.sub{margin:0;font-size:14px;color:var(--muted)}
.small{font-size:12px;color:var(--faint)}
.label{font-size:13px;font-weight:600;color:var(--soft)}
.field{display:flex;flex-direction:column;gap:8px}
.input{height:52px;box-sizing:border-box;padding:0 16px;border-radius:16px;border:1px solid rgba(var(--i),.12);background:rgba(var(--i),.04);font-size:16px;outline:none;width:100%}
textarea.input{height:180px;padding:12px 16px;resize:vertical;line-height:1.45;font-size:14px}
.input.err{border-color:rgba(255,122,107,.6)}
.error{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--coral)}
.cta{min-height:58px;border-radius:20px;border:none;background:linear-gradient(180deg,#FFC56B,#FF9F43);color:#1C1206;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 34px rgba(255,159,67,.3),inset 0 1px 0 rgba(255,255,255,.5);width:100%;flex-shrink:0;animation:ctaglow 3.2s ease-in-out 1.2s infinite;padding:0 16px;text-decoration:none}
.cta.sm{min-height:50px;font-size:16px}
.cta:disabled{opacity:.5;cursor:not-allowed;animation:none}
.ghost{min-height:48px;border-radius:16px;border:1px solid var(--surface-edge);background:var(--surface);box-shadow:var(--surface-shadow);font-weight:700;font-size:15px;padding:0 16px;width:100%;flex-shrink:0}
.ghost.warn{color:var(--coral)}
.link{background:none;border:none;padding:8px 4px;font-weight:700;color:var(--amber);min-height:44px}
.card{padding:16px;background:var(--surface);border:1px solid var(--surface-edge);box-shadow:var(--surface-shadow);border-radius:22px;color:var(--fg);text-align:left;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
button.card{width:100%;font:inherit}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.p-mint{background:rgba(111,214,168,.16);color:var(--mint)}.p-amber{background:rgba(255,181,71,.16);color:var(--amber)}.p-coral{background:rgba(255,122,107,.16);color:var(--coral)}.p-peri{background:rgba(140,155,255,.16);color:var(--peri)}.p-na{background:rgba(var(--i),.08);color:var(--muted)}
.opt{min-height:52px;padding:10px 16px;border-radius:16px;border:1.5px solid rgba(var(--i),.1);background:var(--surface);display:flex;align-items:center;gap:12px;text-align:left;font-size:15px;font-weight:600;width:100%;box-shadow:var(--surface-shadow)}
.opt[aria-pressed="true"]{border-color:#FFB547;background:rgba(255,181,71,.1)}
.opt.peri[aria-pressed="true"]{border-color:#8C9BFF;background:rgba(140,155,255,.12)}
.box{width:22px;height:22px;flex-shrink:0;box-sizing:border-box;border-radius:50%;border:2px solid rgba(var(--i),.25);display:flex;align-items:center;justify-content:center;color:#1C1206}
.box.sq{border-radius:7px}
.opt[aria-pressed="true"] .box{border-color:#FFB547;background:#FFB547}
.opt.peri[aria-pressed="true"] .box{border-color:#8C9BFF;background:radial-gradient(circle,#8C9BFF 45%,transparent 50%)}
.opt .t{display:flex;flex-direction:column;gap:1px;flex-grow:1}.opt .t small{font-size:12px;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.goal{height:92px;padding:12px;box-sizing:border-box;border-radius:18px;border:1.5px solid rgba(var(--i),.1);background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:var(--surface-shadow)}
.goal[aria-pressed="true"]{border-color:#8C9BFF;background:rgba(140,155,255,.12)}
.goal b{font-size:14px}.goal small{font-size:11px;color:var(--muted)}
.tile{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center}.tile i{width:10px;height:10px;border-radius:50%}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:rgba(var(--i),.05)}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{min-height:40px;border-radius:11px;border:none;background:transparent;font-size:13px;font-weight:700}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#FFC56B,#FF9F43);color:#5A2400;box-shadow:0 4px 12px rgba(255,159,67,.3)}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;flex-grow:1}
.bars i{height:5px;border-radius:3px;background:rgba(var(--i),.12);transition:background .3s}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chip{min-height:62px;border-radius:16px;border:1.5px solid rgba(var(--i),.12);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px;box-shadow:var(--surface-shadow)}
.chip b{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-variant-numeric:tabular-nums}
.chip span{font-size:10.5px;color:var(--muted);text-align:center}
.chip[aria-pressed="true"]{border-color:#FFB547;background:rgba(255,181,71,.14)}
.stepper{width:44px;height:44px;border-radius:14px;border:1px solid rgba(var(--i),.07);background:rgba(var(--i),.05);font-size:20px;padding:0}
.num{font-family:var(--numf);font-weight:700;letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:3px;background:rgba(var(--i),.1);overflow:hidden;flex-grow:1}
.track i{display:block;height:100%;border-radius:3px;transform-origin:left;animation:fillx 1.2s cubic-bezier(.2,.8,.2,1) .35s both}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.play{width:38px;height:38px;border-radius:50%;background:linear-gradient(180deg,#FFC56B,#FF9F43);color:#1C1206;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.list{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.list li{padding:12px 0;border-bottom:1px solid rgba(var(--i),.07);display:flex;align-items:center;gap:10px}
.list li:last-child{border-bottom:none}
.thinking{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(var(--i),.2);border-top-color:var(--peri);animation:spin 1s linear infinite;flex-shrink:0}

/* nav */
/* Liquid-glass dock (iPhone style): floats above a soft fade so content never shows raw below it */
nav.bn{position:absolute;left:0;right:0;bottom:0;z-index:10;box-sizing:border-box;padding:36px 14px calc(14px + env(safe-area-inset-bottom, 0px));background:linear-gradient(to top,var(--bg) 0,var(--bg) calc(92px + env(safe-area-inset-bottom, 0px)),rgba(var(--b),0) calc(120px + env(safe-area-inset-bottom, 0px)));pointer-events:none;animation:navup .8s cubic-bezier(.2,.8,.2,1) .35s both}
.dock{pointer-events:auto;position:relative;display:flex;align-items:center;justify-content:space-around;height:70px;padding:0 4px;border-radius:30px;background:var(--glass-bg);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(0,0,0,.06),0 14px 34px rgba(0,0,0,calc(.38*var(--sh))),0 2px 6px rgba(0,0,0,calc(.12*var(--sh)))}
.dock::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,var(--glass-sheen)),rgba(255,255,255,0) 55%);pointer-events:none}
.dock button{position:relative;width:64px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--faint);background:none;border:none;padding:0;transition:color .25s,transform .18s}
.dock button svg{width:22px;height:22px;padding:4px 14px;border-radius:999px;transition:background-color .25s;box-sizing:content-box}
.dock button[aria-current="page"]{font-weight:800;color:var(--amber)}
.dock button[aria-current="page"] svg{background:var(--glass-active)}
.dock button:active{transform:scale(.92)}

/* landing */
.hero{position:relative;height:320px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring{position:absolute;border-radius:50%}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#FFF0CF,#FFB547 50%,#E0761F);box-shadow:0 0 100px rgba(255,164,64,.55),inset 0 -10px 24px rgba(160,70,0,.35);animation:orb 4s ease-in-out infinite}
.fchip{position:absolute;padding:9px 13px;border-radius:16px;background:rgba(var(--c),.85);border:1px solid rgba(var(--i),.09);box-shadow:0 12px 30px rgba(0,0,0,calc(.45*var(--sh)));font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}
.fchip small{display:block;font-size:11px;color:var(--muted);font-weight:500}

/* dashboard hero */
.slider{margin:0 -18px -6px;padding:2px 18px 20px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding:0 18px;scrollbar-width:none;overscroll-behavior-x:contain;cursor:grab}
.slider::-webkit-scrollbar{display:none}
.slider.dragging{scroll-snap-type:none;cursor:grabbing}
.slides{display:flex;gap:10px}
.slides::after{content:"";flex:0 0 8px}
.hcard{position:relative;scroll-snap-align:start;flex:0 0 100%;box-sizing:border-box;padding:18px;border-radius:26px;display:flex;flex-direction:column;gap:10px;overflow:hidden;text-align:left}
.slides.one .hcard{flex-basis:100%}
.hcard.amber{background:linear-gradient(145deg,#FFCB74 0%,#FFA24A 55%,#F47E3C 100%);color:#5A2400;box-shadow:0 8px 14px rgba(244,126,60,.22)}
.hcard.peri{background:linear-gradient(145deg,#C3CBFF 0%,#8C9BFF 50%,#6470F0 100%);color:#1F2A8C;box-shadow:0 8px 14px rgba(100,112,240,.24)}
.hcard .he{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.85}
.hcard .ht{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;line-height:1.05;letter-spacing:-.5px}
.hcard .ht span{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:26px}
.hcard .hs{font-size:12px;font-weight:600;opacity:.8}
.hcard .hb{align-self:flex-start;height:46px;padding:0 18px 0 7px;border-radius:999px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:10px;border:none}
.hcard .hb{background:rgba(255,255,255,.92);box-shadow:0 6px 18px rgba(120,50,0,.18),inset 0 1px 0 #fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .15s,box-shadow .2s}
.hcard .hb:active{transform:scale(.96)}
.hcard.amber .hb{color:#8A3F00}.hcard.peri .hb{color:#2F3AA8;box-shadow:0 6px 18px rgba(40,50,160,.2),inset 0 1px 0 #fff}
.hcard .hb i{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* ---------- mastery + progress (server logic in the real app) ---------- */
function topicScore(t) {
  const ev = (t.evidence || []).slice(-3); if (!ev.length) return null;
  const w = CFG.mastery.weights.slice(-ev.length); const tw = w.reduce((a, b) => a + b, 0);
  return Math.round(ev.reduce((a, e, i) => a + e.score * w[i], 0) / tw);
}
function topicStatus(t) {
  const s = topicScore(t);
  if (s === null) return { key: 'na', word: 'Not assessed', cls: 'p-na', color: 'rgba(var(--i),.25)' };
  if (s >= CFG.mastery.mastered && t.evidence.length >= 2) return { key: 'strong', word: 'Strong', cls: 'p-mint', color: '#6FD6A8' };
  if (s >= CFG.mastery.developing) return { key: 'dev', word: 'Developing', cls: 'p-amber', color: '#FFB547' };
  return { key: 'needs', word: 'Needs work', cls: 'p-coral', color: '#FF7A6B' };
}
const answered = (t) => (t.evidence || []).reduce((a, e) => a + e.n, 0);
const isGap = (t) => { const s = topicScore(t); return s !== null && s < CFG.mastery.gapBelow && answered(t) >= CFG.mastery.gapMinQuestions; };
function subjectProgress(sub) {
  const all = sub.topics.length; if (!all) return null;
  const assessed = sub.topics.filter((t) => topicScore(t) !== null);
  if (!assessed.length) return null;
  return Math.round(assessed.reduce((a, t) => a + topicScore(t), 0) / all);
}
function allTopics() { return S.subjects.flatMap((s) => s.topics.map((t) => ({ s, t }))); }
function overallProgress() {
  const all = allTopics(); if (!all.length) return { pct: null, total: 0, assessed: 0, mastered: 0 };
  const assessed = all.filter(({ t }) => topicScore(t) !== null);
  return { pct: assessed.length ? Math.round(assessed.reduce((a, { t }) => a + topicScore(t), 0) / all.length) : null, total: all.length, assessed: assessed.length, mastered: all.filter(({ t }) => topicStatus(t).key === 'strong').length };
}
function nextDeadline(sub) { return sub.deadline && sub.deadline.status !== 'done' && daysUntil(sub.deadline.date) >= 0 ? sub.deadline : null; }
function readiness(sub) {
  if (!nextDeadline(sub) || !sub.topics.length) return null;
  const assessed = sub.topics.filter((t) => topicScore(t) !== null).length;
  if (assessed / sub.topics.length < CFG.readinessMinAssessed) return { pct: null, assessed, total: sub.topics.length };
  return { pct: subjectProgress(sub), assessed, total: sub.topics.length };
}

/* ---------- planner: what to study next, and why (code, not AI) ---------- */
function urgency(sub) {
  const d = nextDeadline(sub); if (!d) return 0.3;
  const days = daysUntil(d.date); if (days <= CFG.crunchDays) return 2; if (days <= CFG.deadlineWindow) return 1 + (CFG.deadlineWindow - days) / CFG.deadlineWindow; return 0.8;
}
function recommend(subjectId) {
  const pool = allTopics().filter(({ s }) => !subjectId || s.id === subjectId).filter(({ s }) => s.status !== 'archived');
  if (!pool.length) return null;
  let best = null;
  for (const { s, t } of pool) {
    const sc = topicScore(t); const weak = sc === null ? 0.7 : 1 - sc / 100;
    let p = urgency(s) * (0.2 + weak) * (isGap(t) ? 1.6 : 1);
    if (UI.lastTopic === t.id) p *= 0.5;
    if (!best || p > best.p) best = { s, t, p };
  }
  const { s, t } = best; const sc = topicScore(t); const d = nextDeadline(s);
  let why;

/* ---------- file reading (PDF via PDF.js, text files directly) ---------- */
const MAX_MB = 20, MAX_PAGES = 80, MAX_NOTES = 60000, SCAN_PAGES = 4;
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsPromise = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (!pdfjsPromise) pdfjsPromise = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = PDFJS + 'pdf.min.js';
    sc.onload = () => { const lib = window.pdfjsLib; if (!lib) return rej(new Error('pdfjs missing')); lib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; res(lib); };
    sc.onerror = () => { pdfjsPromise = null; rej(new Error('pdfjs failed to load')); };
    document.head.appendChild(sc);
  });
  return pdfjsPromise;
}
async function readPdf(file, onPage) {
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = Math.min(doc.numPages, MAX_PAGES); let text = ''; let textPages = 0;
  for (let i = 1; i <= pages; i++) {
    const page = await doc.getPage(i); const tc = await page.getTextContent();
    let line = '', lastY = null; const lines = [];
    for (const it of tc.items) { const y = it.transform ? it.transform[5] : 0; if (lastY !== null && Math.abs(y - lastY) > 2) { lines.push(line); line = ''; } line += it.str; lastY = y; }
    if (line) lines.push(line);
    const pageText = lines.map((l) => l.replace(/\s+/g, ' ').trim()).filter(Boolean).join('\n');
    if (pageText.length > 20) textPages++;
    text += `\n[Page ${i}]\n${pageText}`;
    if (onPage) onPage(i, pages);
  }
  return { doc, text, pages, textPages };
}
async function renderPdfPages(doc, n) {
  const blobs = [];
  for (let i = 1; i <= Math.min(n, doc.numPages); i++) {
    const page = await doc.getPage(i); const vp = page.getViewport({ scale: 1.6 });
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    blobs.push(await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85)));
  }
  return blobs;
}
function fileCard(f) {
  const tone = f.state === 'error' ? 'p-coral' : f.state === 'scanned' ? 'p-amber' : f.state === 'ready' ? 'p-mint' : 'p-peri';
  const label = f.state === 'error' ? 'Error' : f.state === 'scanned' ? 'Scanned' : f.state === 'ready' ? 'Ready' : 'Reading';
  return `<div class="card" style="gap:8px" data-file="${esc(f.id)}"><div class="row"><span class="pill ${f.kind === 'pdf' ? 'p-coral' : f.kind === 'txt' ? 'p-peri' : 'p-na'}" style="font-size:11px">${f.kind === 'pdf' ? 'PDF' : f.kind === 'txt' ? 'TXT' : 'FILE'}</span><b class="grow" style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</b><span class="pill ${tone}">${label}</span></div>
    ${f.state === 'reading' ? `<div class="track" style="height:6px;position:relative"><i style="width:${f.pct || 3}%;background:#8C9BFF;animation:none;transition:width .3s"></i><span class="shimmer"></span></div><span class="small">${esc(f.msg || 'Reading…')}</span>` : `<span class="small">${esc(f.msg || '')}</span>`}
    ${f.state === 'scanned' && f.canScan ? `<button class="ghost" data-act="scanPdf" data-f="${esc(f.id)}" style="min-height:42px">Read scanned pages with AI (first ${SCAN_PAGES})</button>` : ''}</div>`;
}
function paintFiles(sub) { const el = $('fileList'); if (el) el.innerHTML = (sub.files || []).map(fileCard).join(''); }
function appendNotes(sub, name, text) {
  const cur = sub.fileText || '';
  const add = `\n\n=== ${name} ===\n${text.trim()}`;
  const next = (cur.trim() ? cur + add : add.trim()).slice(0, MAX_NOTES);
  sub.fileText = next;
  if (cur.length + add.length > MAX_NOTES) toast(`Notes are capped at ${MAX_NOTES.toLocaleString()} characters in the prototype, so the end was cut.`);
}
async function handleFiles(sub, list) {
  sub.files = sub.files || [];
  for (const file of list) {
    const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
    const isText = /\.(txt|md)$/i.test(file.name) || /^text\//.test(file.type);
    const f = { id: uid(), name: file.name, kind: isPdf ? 'pdf' : isText ? 'txt' : 'file', state: 'reading', pct: 3, msg: 'Starting…' };
    sub.files.push(f); paintFiles(sub);
    const fail = (msg) => { f.state = 'error'; f.msg = msg; save(); paintFiles(sub); };
    if (!isPdf && !isText) { fail("This file type isn't supported yet. Try a PDF, or a .txt / .md file."); continue; }
    if (file.size > MAX_MB * 1024 * 1024) { fail(`This file is over ${MAX_MB} MB. Try a smaller file or split it.`); continue; }
    if (isText) { const text = await file.text(); if (!text.trim()) { fail('This file is empty.'); continue; } appendNotes(sub, file.name, text); f.state = 'ready'; f.msg = `${text.length.toLocaleString()} characters added`; save(); paintFiles(sub); continue; }
    try {
      f.msg = 'Loading the PDF reader…'; paintFiles(sub);
      const { doc, text: out, pages, textPages } = await readPdf(file, (i, n) => { f.pct = Math.round((i / n) * 100); f.msg = `Reading page ${i} of ${n}…`; paintFiles(sub); });
      if (textPages === 0) {
        const sample = await getSample(); const lim = sample ? await sample.limits().catch(() => null) : null;
        f.state = 'scanned'; f.canScan = !!(lim && lim.images); f.pages = doc.numPages; UI.pdfDocs = UI.pdfDocs || {}; UI.pdfDocs[f.id] = doc;
        const pg = `${doc.numPages} ${doc.numPages === 1 ? 'page' : 'pages'}`; f.msg = f.canScan ? `${pg} with no selectable text (looks scanned). The AI can read the first ${SCAN_PAGES} pages as images.` : `${pg} with no selectable text (looks scanned). Paste the text instead, or try a PDF exported from slides.`;
        save(); paintFiles(sub); continue;
      }
      appendNotes(sub, file.name, out);
      f.state = 'ready'; f.pages = doc.numPages; f.msg = `${doc.numPages} ${doc.numPages === 1 ? 'page' : 'pages'} · ${out.length.toLocaleString()} characters found${doc.numPages > MAX_PAGES ? ` · first ${MAX_PAGES} pages read` : ''}${textPages < pages ? ` · ${pages - textPages} pages had no text` : ''}`;
      save(); paintFiles(sub); toast(`${file.name} is ready.`);
    } catch (e) {
      const msg = e && e.name === 'PasswordException' ? 'This PDF is password-protected. Remove the password and try again.'
        : String(e && e.message).includes('pdfjs') ? "We couldn't load the PDF reader. Check your connection and try again."
        : "We couldn't read this PDF. It may be damaged. Try exporting it again.";
      fail(msg);
    }
  }
}
async function scanPdf(fileId) {
  const sub = S.subjects.find((s) => (s.files || []).some((f) => f.id === fileId)); const f = sub.files.find((x) => x.id === fileId); const doc = UI.pdfDocs && UI.pdfDocs[fileId];
  if (!doc) { toast('Choose the file again to read it.'); return; }
  const sample = await getSample(); const lim = sample ? await sample.limits().catch(() => null) : null;
  if (!lim || !lim.images) { toast('Reading images is not available in this view.'); return; }
  f.state = 'reading'; f.pct = 5; f.msg = 'Preparing pages…'; paintFiles(sub);
  try {
    const n = Math.min(SCAN_PAGES, doc.numPages, lim.images.maxCount); const blobs = [];
    for (let i = 1; i <= n; i++) {
      const page = await doc.getPage(i); const vp = page.getViewport({ scale: 1.6 });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      blobs.push(await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85)));
      f.pct = Math.round((i / n) * 60); f.msg = `Preparing page ${i} of ${n}…`; paintFiles(sub);
    }
    f.msg = 'The AI is reading your pages…'; f.pct = 75; paintFiles(sub);
    const { text } = await ai(`These are ${n} pages of a student's study material for "${sub.name}". Transcribe the study content as clean plain text notes, keeping headings, definitions, formulas and examples. Skip page numbers and decoration. Output only the notes.`, { o: { images: blobs, cache: false } });
    appendNotes(sub, f.name + ' (read by AI)', text);
    f.state = 'ready'; f.msg = `First ${n} pages read by AI · ${text.length.toLocaleString()} characters`; save(); paintFiles(sub);
  } catch (e) { f.state = 'error'; f.msg = errText(e); save(); paintFiles(sub); }
}

/* Pick the parts of long notes that matter for a topic (grounding without sending everything). */
function notesFor(sub, topicName, max) {
  const notes = sub.notes || ''; if (notes.length <= max) return notes;
  const chunks = notes.split(/\n{2,}|\n(?=\[Page \d+\])/).flatMap((c) => c.length > 900 ? c.match(/[\s\S]{1,900}/g) : [c]).filter((c) => c.trim());
  if (!topicName) { const step = Math.max(1, Math.floor(chunks.length / Math.ceil(max / 900))); return chunks.filter((_, i) => i % step === 0).join('\n\n').slice(0, max); }
  const words = topicName.toLowerCase().split(/[^a-z0-9]+/).filter((w) => w.length > 3);
  const scored = chunks.map((c, i) => ({ c, i, s: words.reduce((a, w) => a + (c.toLowerCase().split(w).length - 1), 0) }));
  const keep = scored.filter((x) => x.s > 0).sort((a, b) => b.s - a.s); let out = [], len = 0;
  for (const x of keep) { if (len + x.c.length > max) break; out.push(x); len += x.c.length; }
  if (!out.length) return notes.slice(0, max);
  return out.sort((a, b) => a.i - b.i).map((x) => x.c).join('\n\n');
}

  <div id="aOut" class="col"></div>`,

async function runAnalysis(sub, n) {
  let step = 0; let aiDone = null; let topics = null; let failed = null;
  const paint = () => { document.querySelectorAll('#aSteps [data-i]').forEach((el) => { const i = +el.dataset.i; el.style.color = i <= step ? 'var(--fg)' : 'var(--faint)'; el.style.fontWeight = i === step ? '700' : '500'; el.querySelector('.st').innerHTML = i < step ? `<span style="color:var(--mint)">${ICON.check}</span>` : i === step ? '<span class="spinner"></span>' : '•'; }); };
  paint();
  const sampleSub = sampleByNotes(sub.notes);
  aiDone = (async () => {
    try {
      const raw = await ai(`Read these study notes for the subject "${sub.name}" and split them into 3 to 6 study topics a student should learn.\nReply with only a JSON array: [{"name": short topic name, "minutes": estimated study minutes 5-30, "summary": one short sentence}].\nNOTES:\n"""\n${notesFor(sub, null, 12000)}\n"""`, { json: true, o: { modelTier: 'quick', cache: false } });
      const list = (Array.isArray(raw) ? raw : []).filter((x) => x && typeof x.name === 'string' && x.name.trim()).slice(0, 6).map((x) => [x.name.trim().slice(0, 60), Math.min(30, Math.max(5, Math.round(Number(x.minutes) || 10))), String(x.summary || '').slice(0, 140)]);
      if (list.length < 2) throw { code: 'invalid_json' };
      topics = list;
    } catch (e) {
      if (sampleSub) topics = sampleSub.topics.map((t) => [t[0], t[1], t[2]]);
      else if (e && e.code === 'unavailable' || PERMANENT.includes(e && e.code)) topics = sub.notes.split(/\n+/).map((l) => l.trim()).filter((l) => l.length > 20 && !/^(===|\[Page)/.test(l)).slice(0, 5).map((l) => [l.split(/[.:(]/)[0].slice(0, 50), 10, 'From your notes (AI off: split by line)']);
      else failed = e;
      if (topics && topics.length < 2 && !failed) failed = { code: 'too_short' };
    }
  })();
  const t0 = Date.now();
  const timer = setInterval(() => { if (step < n - 1) { step++; paint(); } }, 1100);
  await aiDone; await new Promise((r) => setTimeout(r, Math.max(0, t0 + (n - 1) * 1100 - Date.now())));
  clearInterval(timer); if (UI.screen !== 'analysis') return;
  if (failed) {
    $('aHead').textContent = "We couldn't read that yet";
    $('aOut').innerHTML = `<p class="sub">${failed.code === 'too_short' ? 'Your notes need a few more lines so we can find topics.' : esc(errText(failed))} Your notes are saved.</p><button class="cta sm" data-go="analysis" data-s="${sub.id}">Try again</button><button class="ghost" data-go="notes" data-s="${sub.id}">Edit my notes</button>`;
    return;
  }
  step = n; paint();
  sub.topics = topics.map(([name, minutes, summary]) => ({ id: uid(), name, minutes, summary, evidence: [] }));
  sub.analysedAt = Date.now(); save();
  $('aHead').innerHTML = 'Here’s what <em>we found</em>';
  $('aOut').innerHTML = `<div class="card"><span class="eyebrow">${sub.topics.length} topics · about ${sub.topics.reduce((a, t) => a + t.minutes, 0)} min</span><ul class="list">${sub.topics.map((t) => `<li><span class="grow col" style="gap:1px"><b style="font-size:14px">${esc(t.name)}</b><span class="small">${esc(t.summary)}</span></span><span class="small" style="font-weight:700">${t.minutes} min</span></li>`).join('')}</ul></div><button class="cta" data-go="plan" data-s="${sub.id}">See my study plan ${ICON.arrow}</button>`;
}

const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

/* Knowledge gap */

/* Subjects & deadlines */
SCREENS.subjects = () => {

  const tot = w.reduce((a, x) => a + x.u, 0) || 1; const weekly = ((S.profile?.wd ?? 2) * 5 + (S.profile?.we ?? 4) * 2);
  const split = w.map(({ s, u }) => ({ s, pct: Math.max(s.deadline ? 0 : 15, Math.round((u / tot) * 100)) }));
  return { glow: 'glow-peri', html: `

    ${d ? `<div class="row"><span class="grow col" style="gap:0"><b style="font-size:14px">${cap(d.type)} · ${fmtDate(d.date)}</b><span class="small">${d.covers === 'all' ? 'Whole subject' : 'Some chapters'}${days !== null && days <= CFG.crunchDays && days >= 0 ? ' · crunch mode: practice first' : ''}</span></span><span class="pill ${days < 0 ? 'p-mint' : days <= CFG.crunchDays ? 'p-coral' : 'p-amber'}">${days < 0 ? 'Done' : days + ' days'}</span></div>${days < 0 ? '<span class="small">How did it go? Add the next date, keep revising, or archive the subject.</span>' : ''}` : `<div class="row"><span class="grow small">Learning at your own pace</span><button class="link" data-act="addDate" data-s="${s.id}">+ Add a date</button></div>`}${pace}<button class="link" data-act="removeSubject" data-s="${s.id}" style="align-self:flex-start;padding-left:0;color:var(--coral)">Remove subject</button></div>`; }).join('')}

};

function streakCal() {
  const today = todayISO(); const days = new Set(S.streak.days); const cells = [];

const RING = 553;

// Light formatting for tutor answers: **bold**, "- " bullets, paragraphs. Text is escaped first.
function renderRich(el, text) {

async function addAttachment(file) {

  if (UI.attach.length >= CHAT_MAX_FILES) { toast(`You can attach up to ${CHAT_MAX_FILES} files per message.`); return; }
  const a = { id: uid(), name: file.name, kind: 'file', state: 'reading' }; UI.attach.push(a); paintAttach();
  const fail = (msg) => { a.state = 'error'; a.msg = msg; paintAttach(); setTimeout(() => { UI.attach = (UI.attach || []).filter((x) => x !== a); paintAttach(); }, 4000); };
  const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
  const isImg = /^image\//.test(file.type) || /\.(png|jpe?g|webp|gif)$/i.test(file.name);
  const isText = /\.(txt|md)$/i.test(file.name) || /^text\//.test(file.type);
  try {
    if (file.size > MAX_MB * 1024 * 1024) return fail(`over ${MAX_MB} MB`);
    if (isImg) {
      a.kind = 'image';
      const lim = await imageLimits();
      if (!lim || !lim.images) return fail("images aren't available in this view");
      if (lim.images.mediaTypes && !lim.images.mediaTypes.includes(file.type)) return fail('use JPG, PNG, WebP or GIF');
      if (file.size > lim.images.maxInputBytes) return fail('image too large');
      a.blobs = [file]; a.url = URL.createObjectURL(file); a.state = 'ready';
    } else if (isPdf) {
      a.kind = 'pdf';
      const { doc, text, pages, textPages } = await readPdf(file);
      if (textPages > 0) { a.text = text; a.state = 'ready'; a.note = `${pages} ${pages === 1 ? 'page' : 'pages'}`; }
      else {
        const lim = await imageLimits();
        if (!lim || !lim.images) return fail('scanned PDF: paste the text instead');
        a.kind = 'scan'; a.blobs = await renderPdfPages(doc, Math.min(3, lim.images.maxCount)); a.state = 'ready'; a.note = `scanned · first ${a.blobs.length} ${a.blobs.length === 1 ? 'page' : 'pages'}`;
      }
    } else if (isText) {
      a.kind = 'text'; a.text = await file.text(); if (!a.text.trim()) return fail('empty file'); a.state = 'ready';
    } else return fail('use a PDF, image or text file');
    paintAttach();
  } catch (e) { fail(e && e.name === 'PasswordException' ? 'password-protected PDF' : "couldn't read this file"); }
}
function mkBubble(who, text, atts = []) {

async function loadQuiz() {
  const R = UI.run; const sub = S.subjects.find((s) => s.id === R.subjectId); const t = sub.topics.find((x) => x.id === R.topicId);
  $('quizBody').innerHTML = '<span class="thinking"><span class="spinner"></span>Writing questions from your notes…</span>'; $('qbar').innerHTML = '';
  let quiz = null;

    const N = R.qn || 3; const raw = await ai(`Write a ${N}-question multiple-choice quiz that checks understanding of "${t.name}", ${sub.noNotes ? 'using standard university-level material (the student has no notes yet)' : `based ONLY on these notes:\n"""\n${notesFor(sub, t.name, 7000)}\n"""`}\nReply with only a JSON array of ${N} objects: {"q": string, "options": [4 short strings], "answer": index 0-3, "why": one-sentence explanation}.`, { json: true, o: { modelTier: 'default', cache: false } });
    quiz = (Array.isArray(raw) ? raw : []).filter((x) => x && typeof x.q === 'string' && Array.isArray(x.options) && x.options.length === 4 && [0, 1, 2, 3].includes(Number(x.answer))).slice(0, R.qn || 3).map((x) => ({ q: x.q, options: x.options.map(String), answer: Number(x.answer), why: String(x.why || '') }));

}

function answerQ(k) {

async function explainMistake(k) {

/* Quest completion: the one state transition (idempotent) */
function finishQuest(endedEarly) {
  const R = UI.run; if (!R || R.finished) return; R.finished = true;
  const left = leftMs(); const focusedMs = R.totalMs - left; clearInterval(UI.tick); R.running = false;
  const sub = S.subjects.find((s) => s.id === R.subjectId); const t = sub.topics.find((x) => x.id === R.topicId);
  const answeredList = (R.answers || []).filter((a) => a !== undefined); const n = answeredList.length, right = answeredList.filter(Boolean).length;
  const completed = !endedEarly && R.quiz && n === R.quiz.length && R.learned;
  const prevScore = topicScore(t); const wasGap = isGap(t);
  if (n) t.evidence.push({ score: Math.round((right / n) * 100), n, at: Date.now() });
  const awards = []; let points = 0; let streak = null;
  if (completed) {
    points += award('quest-' + R.id, CFG.points.QUEST, 'Quest completed', `${sub.name} · ${t.name}`) && (awards.push(['Quest completed', CFG.points.QUEST]), CFG.points.QUEST);
    if (R.timeUp) points += award('focus-' + R.id, CFG.points.FOCUS_SESSION, 'Focus Session completed', fmt(R.totalMs) + ' focused') && (awards.push(['Focus Session completed', CFG.points.FOCUS_SESSION]), CFG.points.FOCUS_SESSION);
    const nowScore = topicScore(t);
    if (wasGap && nowScore !== null && prevScore !== null && nowScore > prevScore) points += award('gap-' + R.id, CFG.points.GAP_IMPROVED, 'Knowledge gap improved', `${t.name} ${prevScore}% → ${nowScore}%`) && (awards.push(['Knowledge gap improved', CFG.points.GAP_IMPROVED]), CFG.points.GAP_IMPROVED);
    streak = recordStreak(R.id); if (streak.pts) { points += streak.pts; awards.push(['Streak kept', streak.pts]); }
  }
  S.quests.push({ id: R.id, subjectId: sub.id, topicId: t.id, status: completed ? 'completed' : 'ended_early', mins: Math.max(0, Math.round(focusedMs / 60000)), at: Date.now() });
  S.lastQuest = completed ? null : { id: R.id, subjectId: sub.id, topicId: t.id, step: R.step, status: 'in_progress', at: Date.now() };
  UI.lastTopic = t.id;
  UI.result = { subjectId: sub.id, topicId: t.id, completed, learned: !!R.learned, n, right, focusedMs, points, awards, streak, prevScore, firstScore: prevScore === null && n > 0, gapOpened: !wasGap && isGap(t) };
  UI.run = null; save(); go('results');
}

/* ---------- Mic: browser speech-to-text into the question box ---------- */
const hasSpeech = () => !!(window.SpeechRecognition || window.webkitSpeechRecognition);
function toggleMic(btn) {
  if (UI.rec) { UI.rec.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) { toast('Voice input is not supported in this browser. Type instead.'); return; }
  const rec = new SR(); UI.rec = rec; rec.lang = navigator.language || 'en-IN'; rec.interimResults = true; rec.continuous = false;
  const box = $('askInput'); const before = box.value ? box.value.trim() + ' ' : '';
  rec.onresult = (e) => { box.value = before + [...e.results].map((r) => r[0].transcript).join(''); };
  rec.onerror = (e) => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast("The microphone isn't allowed here. Type your question instead."); else if (e.error === 'no-speech') toast("Didn't catch that. Tap the mic and try again."); };
  rec.onend = () => { UI.rec = null; btn.classList.remove('rec'); btn.setAttribute('aria-label', 'Speak your question'); box.focus(); };

/* Number Sprint · Colour Match · Word Scramble */
const COLOURS = [['Red', '#FF5A4E'], ['Blue', '#4C7DFF'], ['Green', '#22B573'], ['Yellow', '#E0A800']];

const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

    const opts = new Set([w]); while (opts.size < 4) opts.add(SCRAMBLE[Math.floor(Math.random() * SCRAMBLE.length)]);

  } else {

}

/* Mini Sudoku 4×4: fill 1–4 so every row, column and 2×2 box has each number once */
const SUDOKU = [

function sdkNum(v) {

  if (G.cells.every(Boolean)) {

    const groups = []; for (let k = 0; k < 4; k++) { groups.push([0, 1, 2, 3].map((j) => k * 4 + j)); groups.push([0, 1, 2, 3].map((j) => j * 4 + k)); }

}

/* Chess Puzzle: White to play and checkmate in one move */
const CHESS = [
  { title: 'Back-rank mate', pieces: { a1: 'R', g1: 'K', f2: 'P', g2: 'P', h2: 'P', g8: 'k', f7: 'p', g7: 'p', h7: 'p' }, sol: ['a1a8'], why: 'The rook checks along the back rank and the king is boxed in by its own pawns.' },
  { title: 'Queen and king', pieces: { g6: 'K', a7: 'Q', g8: 'k' }, sol: ['a7g7', 'a7a8'], why: 'The queen checks while your king covers every escape square.' },
  { title: 'Smothered mate', pieces: { a1: 'K', e5: 'N', h8: 'k', g8: 'r', g7: 'p', h7: 'p' }, sol: ['e5f7'], why: 'The knight checks and the king is smothered by its own pieces.' },
];
const PIECE = { K: '♔', Q: '♕', R: '♖', B: '♗', N: '♘', P: '♙', k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };

    board += `<button class="cz ${dark ? 'd' : 'l'} ${G.sel === sq ? 'sel' : ''}" data-act="chessSq" data-sq="${sq}" aria-label="${sq}${pc ? ' ' + pc : ''}">${pc ? `<span class="pc ${pc === pc.toUpperCase() ? 'w' : 'b'}">${PIECE[pc]}&#xFE0E;</span>` : ''}${f === 0 ? `<i class="cz-r">${r}</i>` : ''}${r === 1 ? `<i class="cz-f">${files[f]}</i>` : ''}</button>`; }

  const start = Date.now(); clearInterval(UI.breathT); let last = '';
  UI.breathT = setInterval(() => {
    const el = $(id); if (!el) { clearInterval(UI.breathT); return; }
    const gone = Date.now() - start, left = total - gone, t = (gone % 12000) / 1000;
    const [ph, hint] = t < 4 ? ['Inhale', 'Breathe in slowly through your nose', 4 - t] : t < 6 ? ['Hold', 'Hold gently', 6 - t] : ['Exhale', 'Let it all out through your mouth', 12 - t];
    el.textContent = `${fmt(Math.max(0, left)).replace(/^0/, '')} left`;
    if (ph !== last && $('bPhase')) { last = ph; $('bPhase').textContent = ph + '…'; $('bHint').textContent = hint; }
    if (left <= 0) { clearInterval(UI.breathT); if ($('bPhase')) { $('bPhase').textContent = 'Done'; $('bHint').textContent = 'Nice. One more calm breath, then back to it.'; el.textContent = ''; } done(); }
  }, 200);
}
function takeBreak() {
  pauseTimer('On a break'); clearInterval(UI.breathT); clearInterval(UI.gameT); UI.game = null;
  const opt = (act, hex, path, title, sub2) => `<button class="brk-opt" data-act="${act}"><span class="brk-ico" style="background:${hexA(hex, .16)};color:${hex}">${sv(path, 22)}</span><span class="grow col" style="gap:2px"><b>${title}</b><span class="small">${sub2}</span></span>${sv('<path d="M9 5l7 7-7 7"/>', 16)}</button>`;
  sheet(`<span class="eyebrow" style="color:var(--amber)">Quest paused at ${fmt(leftMs())}</span><h2>Step away <span class="serif">for a moment</span></h2><p class="sub" style="margin:0">Choose how you would like to recharge. Your progress is safe.</p>
    <div class="col" style="gap:10px">
      ${opt('focusGames', '#8C9BFF', '<path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3zM9.5 20h5"/>', 'Focus refresher', 'Two-minute brain exercises to sharpen attention')}
      ${opt('restBreak', '#6FD6A8', '<path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9zM17 11h1.5a2.5 2.5 0 0 1 0 5H17M8 3v3M12 3v3"/>', 'Rest break', 'A calm 15-second breather, then 5, 10 or 15 minutes away')}
    </div>

}
function restBreak() {

    ${breathCircle().replace('0:30', '0:15')}
    <div id="breakPick" class="col" hidden><b>How long a break?</b><div class="chips" style="grid-template-columns:repeat(3,minmax(0,1fr))">${CFG.breakMins.map((m) => `<button class="chip" data-act="startBreak" data-m="${m}"><b>${m}</b><span>minutes</span></button>`).join('')}</div></div>

async function prepPark(i) {
  const p = S.parked[i]; UI.parkBusy = i; render({ still: true });
  try {
    const raw = await ai(`A student parked this task during a study session: "${p.text}". Help them get it done quickly afterwards. Do not claim to have done anything.\nStudent profile: ${S.profile?.level || ''}, ${S.profile?.course || ''}.\nReply with only JSON: {"summary": one sentence, "steps": [3 short steps], "missing": [info they still need to find, can be empty]}.`, { json: true, o: { modelTier: 'quick', cache: false } });
    p.prep = { summary: String(raw.summary || ''), steps: (raw.steps || []).slice(0, 4).map(String), missing: (raw.missing || []).slice(0, 4).map(String) };
  } catch (e) { p.prep = { summary: 'Here is a simple plan (AI is off in this view).', steps: ['Collect what you need for it', 'Do it in one short sitting after studying', 'Check it before you send or submit'], missing: [] }; }
  UI.parkBusy = null; save(); render({ still: true }); haptic([10, 30, 10]); toast('Ready. Your plan is below the task.');
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('overlay').innerHTML) dismissSheet(); if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('div[data-go]')) { e.preventDefault(); e.target.click(); } });

function sheet(html) {
  const open = $('overlay').querySelector('.sheet');
  if (open) { const top = open.scrollTop; open.innerHTML = `<div class="grab"></div>${html}`; open.scrollTop = top; return; } // update in place: no slide-up replay
  $('overlay').innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
}
function dismissSheet() {
  closeSheet(); UI.refStart = null; const R = UI.run;
  if (R && !R.running && !R.timeUp && !R.finished && $('clock')) { resumeTimer(); toast('Welcome back. Your Quest timer is running again.'); }
}
function closeSheet() { $('overlay').innerHTML = ''; clearInterval(UI.breathT); clearInterval(UI.gameT); clearInterval(UI.breakT); UI.game = null; if (UI.rec) { try { UI.rec.stop(); } catch (_) {} } }
let toastT;
function toast(msg) { document.querySelectorAll('.toast').forEach((t) => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; $('frame').appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2800); }

/* ---------- sample student (clearly simulated) ---------- */
function sampleState() {
  const st = fresh(); const today = todayISO();
  st.user = { email: 'shashwat@college.edu' };
  st.profile = { name: 'Shashwat', level: 'Undergraduate', course: 'B.Tech — AI & Data Science', wd: 2, we: 4, blockers: ['Phone / social media', 'Losing focus'] };
  // A student who has used FocusMate for ~11 weeks: every number below is derived from this simulated history.
  const DAY = 86400000; const ago = (d, h = 19) => Date.now() - d * DAY - (19 - h) * 3600000;
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const SCORES = { 'Descriptive Statistics': [80, 90, 100], 'Probability': [60, 75, 85], 'Hypothesis Testing': [40, 33, 33], 'Regression': [67],
    'Product Discovery': [85, 100], 'Prioritisation (RICE)': [67, 80, 87], 'Product Metrics': [60, 73], 'Roadmaps': [],
    'Data Cleaning': [100, 100, 100], 'Exploratory Data Analysis': [80, 93], 'Model Evaluation': [47, 53], 'Feature Engineering': [73],
    'LLM Fundamentals': [80, 87], 'Prompt Engineering': [73, 93], 'Retrieval-Augmented Generation': [60], 'Evaluation and Monitoring': [] };
  const ev = (arr) => arr.map((sc, i) => ({ score: sc, n: 5, at: ago((arr.length - i) * 6) }));
  st.subjects = SAMPLE_SUBJECTS.map((x) => ({ id: uid(), name: x.name, color: x.color, goal: x.goal, start: 'ai', status: 'active', notes: x.notes,
    deadline: x.days === null ? null : { type: x.goal, date: addDays(today, x.days), covers: x.covers, status: 'upcoming' },
    topics: x.topics.map(([name, minutes, summary, scores]) => ({ id: uid(), name, minutes, summary, evidence: ev(SCORES[name] || scores) })) }));
  // A fifth subject, finished long ago and still revised at own pace
  st.subjects.push({ id: uid(), name: 'SQL & Databases', color: 'pink', goal: 'own_pace', start: 'revision', status: 'active', deadline: null,
    notes: 'SELECT, WHERE, GROUP BY and HAVING filter and summarise rows. JOINs combine tables: INNER keeps matches, LEFT keeps every left row. Normalisation removes duplication (1NF, 2NF, 3NF). Indexes speed up reads but slow writes.',
    topics: [['SQL Basics', 10, 'SELECT, WHERE, ORDER BY.', [93, 100, 100]], ['Joins', 15, 'INNER, LEFT and self joins.', [80, 87, 93]], ['Aggregation', 15, 'GROUP BY and HAVING.', [87, 93]], ['Normalisation', 15, '1NF, 2NF and 3NF.', [73, 80]]]
      .map(([name, minutes, summary, scores]) => ({ id: uid(), name, minutes, summary, evidence: ev(scores) })) });
  // Study calendar: an earlier 41-day streak (days 80–40), a 5-day gap, then the current 34-day streak (days 34–1).
  const studyDays = []; for (let d = 80; d >= 40; d--) studyDays.push(d); for (let d = 34; d >= 1; d--) studyDays.push(d);
  const pool = []; st.subjects.forEach((sub) => sub.topics.forEach((t) => pool.push([sub.name, t.name])));
  const L = (at, pts, action, detail) => ({ key: uid(), pts, action, detail, at: new Date(at).toISOString() });
  st.ledger = []; st.quests = []; let run = 0, prev = null, k = 0;
  studyDays.forEach((d) => {

    const n = rnd() < 0.45 ? 2 : 1; let dayMins = 0;
    for (let i = 0; i < n; i++) {
      const [sn, tn] = pool[(k++ * 7) % pool.length]; const mins = rnd() < 0.55 ? 50 : 25; dayMins += mins; const at = ago(d, 17 + i * 2);
      st.quests.push({ id: uid(), status: 'completed', mins, at });
      st.ledger.push(L(at, 50, 'Quest completed', `${sn} · ${tn}`));

    st.redemptions.push({ key, rewardId: rid, ref: 'SIM-' + uid().toUpperCase().slice(0, 6), at });
    st.ledger.push({ key, pts: -r.cost, action: 'Reward claimed', detail: `${r.title} · ${r.partner} (simulated)`, at });
  });
  st.ledger.sort((x, y) => x.at.localeCompare(y.at));

    { text: 'Pay the hostel mess fees', at: new Date(ago(9, 15)).toISOString(), done: true, prep: null }];
  return st;
}
